; HUM Rainmeter skin, UI shell. Data measures will be wired after emitter reconciliation.
; Close unloads THIS skin (!DeactivateConfig). It does not quit the whole Rainmeter application.
[Rainmeter]
Update=90000
AccurateText=1
DynamicWindowSize=1
AlwaysOnTop=-2
ClickThrough=0
Draggable=1

[Variables]
Ink=26,26,26,255
Green=14,77,58,255
Deep=10,58,44,255
Gold=201,162,39,255
White=247,245,240,255
Muted=182,183,178,255
Endpoint=http://100.88.230.67:8765/hum
LastUpdated=never

; Parent fetches once per 90-second skin update. Only successful parses replace visible values.
[MeasureUsage]
Measure=WebParser
URL=#Endpoint#
UpdateRate=1
RegExp=(?s)^\{"display":\["([^"]*)","([^"]*)","([^"]*)","([^"]*)","([^"]*)","([^"]*)","([^"]*)","([^"]*)","([^"]*)","([^"]*)"\]\}$
DynamicVariables=1
FinishAction=[!UpdateMeasureGroup WebChildren][!SetOption MeterTodayValue Text "[MeasureField1]"][!SetOption MeterNoraSession Text "[MeasureField2]"][!SetOption MeterNoraSessionMetrics Text "[MeasureField3]"][!SetOption MeterITGuySession Text "[MeasureField4]"][!SetOption MeterITGuySessionMetrics Text "[MeasureField5]"][!SetOption MeterNora24h Text "[MeasureField6]"][!SetOption MeterNora24hMetrics Text "[MeasureField7]"][!SetOption MeterITGuy24h Text "[MeasureField8]"][!SetOption MeterITGuy24hMetrics Text "[MeasureField9]"][!SetVariable LastUpdated "[MeasureField10]"][!SetOption MeterUpdated Text "[MeasureField10]"][!UpdateMeterGroup Content][!Redraw]
OnConnectErrorAction=[!SetOption MeterUpdated Text "STALE · #LastUpdated#"][!UpdateMeter MeterUpdated][!Redraw]
OnRegExpErrorAction=[!SetOption MeterUpdated Text "STALE · #LastUpdated#"][!UpdateMeter MeterUpdated][!Redraw]

[MeasureField1]
Measure=WebParser
Group=WebChildren
URL=[MeasureUsage]
StringIndex=1
[MeasureField2]
Measure=WebParser
Group=WebChildren
URL=[MeasureUsage]
StringIndex=2
[MeasureField3]
Measure=WebParser
Group=WebChildren
URL=[MeasureUsage]
StringIndex=3
[MeasureField4]
Measure=WebParser
Group=WebChildren
URL=[MeasureUsage]
StringIndex=4
[MeasureField5]
Measure=WebParser
Group=WebChildren
URL=[MeasureUsage]
StringIndex=5
[MeasureField6]
Measure=WebParser
Group=WebChildren
URL=[MeasureUsage]
StringIndex=6
[MeasureField7]
Measure=WebParser
Group=WebChildren
URL=[MeasureUsage]
StringIndex=7
[MeasureField8]
Measure=WebParser
Group=WebChildren
URL=[MeasureUsage]
StringIndex=8
[MeasureField9]
Measure=WebParser
Group=WebChildren
URL=[MeasureUsage]
StringIndex=9
[MeasureField10]
Measure=WebParser
Group=WebChildren
URL=[MeasureUsage]
StringIndex=10

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,350,388,12 | Fill Color #Ink# | StrokeWidth 0
DynamicVariables=1

[MeterHeader]
Meter=Shape
Shape=Rectangle 0,0,350,39,10 | Fill Color #Green# | StrokeWidth 0
Shape2=Rectangle 0,17,350,22 | Fill Color #Green# | StrokeWidth 0
Shape3=Rectangle 0,0,4,39 | Fill Color #Gold# | StrokeWidth 0

[MeterBrand]
Meter=String
X=15
Y=12
Text=NORA  ·  ITGUY
FontFace=Tahoma
FontSize=8
FontWeight=800
FontColor=#White#
AntiAlias=1

[MeterName]
Meter=String
X=265
Y=12
Text=HUM
FontFace=Tahoma
FontSize=9
FontWeight=800
FontColor=#White#
AntiAlias=1

; Collapse only the visible card content. The header stays to permit restore.
[MeterMinimize]
Meter=String
X=300
Y=8
W=22
H=22
Text=−
StringAlign=CenterCenter
FontFace=Consolas
FontSize=12
FontColor=#White#
SolidColor=0,0,0,1
AntiAlias=1
LeftMouseUpAction=[!HideMeterGroup Content][!HideMeter MeterMinimize][!ShowMeter MeterRestore][!SetOption MeterBackground Shape "Rectangle 0,0,350,39,10 | Fill Color #Ink# | StrokeWidth 0"][!UpdateMeter MeterBackground][!UpdateMeter MeterRestore][!Redraw]

[MeterRestore]
Meter=String
X=300
Y=8
W=22
H=22
Text=+
StringAlign=CenterCenter
FontFace=Consolas
FontSize=12
FontColor=#White#
SolidColor=0,0,0,1
AntiAlias=1
Hidden=1
LeftMouseUpAction=[!SetOption MeterBackground Shape "Rectangle 0,0,350,388,12 | Fill Color #Ink# | StrokeWidth 0"][!ShowMeterGroup Content][!HideMeter MeterRestore][!ShowMeter MeterMinimize][!UpdateMeter MeterBackground][!UpdateMeterGroup Content][!UpdateMeter MeterMinimize][!Redraw]

; Deactivating this config UNLOADS HUM. !Hide would only conceal it in the background.
[MeterClose]
Meter=String
X=326
Y=8
W=22
H=22
Text=×
StringAlign=CenterCenter
FontFace=Consolas
FontSize=12
FontColor=#White#
SolidColor=0,0,0,1
AntiAlias=1
LeftMouseUpAction=[!DeactivateConfig]

